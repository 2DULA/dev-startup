<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer> </script>
</head>

<body>
    <main class="container">

        <h1>Apply Form</h1>

        <p>Hi, My name is Mohamed Adil and I like coding.</p>
        <p>Apply to be my friend!</p>

        <form novalidate>
            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname">
                <span id="firstNameError" style="color: red; font-size: 13px;"></span>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <span id="emailError" style="color: red; font-size: 13px"></span>
            </div>
            <input type="submit" value="Submit">
        </form>
        <p id="confirmation" style="color: green;"></p>

</body>
</main>

</html>
